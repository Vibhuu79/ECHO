services:
  # ----------------------------------------------------
  # 1. Backend Web Service (Node.js Express + Socket.IO)
  # ----------------------------------------------------
  - type: web
    name: echo-server
    env: node
    rootDir: server
    buildCommand: npm install && npm run build
    startCommand: node dist/server.js
    plan: free
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: CLIENT_URL
        sync: false
      - key: MONGO_URI
        sync: false
      - key: REDIS_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true

  # ----------------------------------------------------
  # 2. Frontend Static Site (Vite + React SPA)
  # ----------------------------------------------------
  - type: static
    name: echo-frontend
    rootDir: client
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    autoDeploy: true
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        sync: false
      - key: VITE_SOCKET_URL
        sync: false
